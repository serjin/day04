<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo Preview</title>
</head>
<body>
  <h1>할 일 목록</h1>
  <p id="status">불러오는 중...</p>
  <ul id="todo-list"></ul>
  <a href="index.html">홈으로</a>

  <script>
    const SUPABASE_URL = 'https://xvybnyojhweiudjbktdq.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'sb_publishable_9QqxBDq0CpA1UJdPL3YzAw_AWj5yRYg';

    // 표시할 컬럼과 화면에 보일 이름
    const FIELDS = [
      ['id', 'ID'],
      ['amount', '수량'],
      ['done', '완료 여부', v => (v ? '완료' : '미완료')],
      ['due_date', '마감일'],
      ['created_at', '생성일', v => new Date(v).toLocaleString('ko-KR')]
    ];

    async function loadTodos() {
      const status = document.getElementById('status');
      const list = document.getElementById('todo-list');

      try {
        const res = await fetch(SUPABASE_URL + 'test_todos?select=*&order=id', {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: 'Bearer ' + SUPABASE_KEY
          }
        });
        if (!res.ok) throw new Error(res.status + ' ' + (await res.text()));

        const todos = await res.json();
        if (todos.length === 0) {
          status.textContent = '표시할 할 일이 없습니다.';
          return;
        }
        status.textContent = '총 ' + todos.length + '개';

        todos.forEach(row => {
          const li = document.createElement('li');
          const title = document.createElement('strong');
          title.textContent = row.title;
          if (row.done) title.style.textDecoration = 'line-through';
          li.appendChild(title);

          const details = document.createElement('ul');
          FIELDS.forEach(([key, label, format]) => {
            if (!(key in row)) return;
            const value = row[key];
            const item = document.createElement('li');
            item.textContent = label + ': ' + (value === null ? '-' : format ? format(value) : value);
            details.appendChild(item);
          });
          li.appendChild(details);
          list.appendChild(li);
        });
      } catch (err) {
        status.textContent = '불러오기 실패: ' + err.message;
      }
    }

    loadTodos();
  </script>
</body>
</html>
